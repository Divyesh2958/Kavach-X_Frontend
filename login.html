<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | KAVACH-X Personal Safety</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Minimal Brand Navigation -->
  <nav class="navbar navbar-kavach py-3">
    <div class="container justify-content-between">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-shield-shaded brand-shield"></i>
        <span>KAVACH<span class="text-danger">-X</span></span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-light">
        <i class="bi bi-arrow-left me-1"></i> Emergency Home
      </a>
    </div>
  </nav>

  <!-- Login Card Container -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-wrap">
          <i class="bi bi-person-lock"></i>
        </div>
        <h3 class="auth-title">Welcome Back</h3>
        <p class="auth-subtitle">Access your protected safety dashboard and emergency contacts</p>
      </div>

      <form id="login-form">
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="login-email" placeholder="name@example.com" value="priya.sharma@example.com" required>
          <label for="login-email"><i class="bi bi-envelope me-1"></i>Email Address</label>
        </div>

        <div class="input-group mb-3">
          <div class="form-floating flex-grow-1">
            <input type="password" class="form-control" id="login-password" placeholder="Password" value="PriyaPass@123" required>
            <label for="login-password"><i class="bi bi-lock me-1"></i>Password</label>
          </div>
          <button class="btn btn-outline-secondary password-toggle-btn px-3" type="button" data-target="login-password">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me" checked>
            <label class="form-check-label small text-muted" for="remember-me">Keep me signed in</label>
          </div>
          <a href="#" class="small text-decoration-none text-muted" onclick="KavachApp.showToast('Please contact administrator to reset password.', 'info')">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-navy w-100 btn-auth-submit mb-3">
          <i class="bi bi-shield-check me-2"></i>Sign In Securely
        </button>

        <div class="text-center small text-muted mt-3">
          Don't have a personal account yet? 
          <a href="register.html" class="fw-bold text-dark text-decoration-none">Create Account</a>
        </div>

        <!-- Quick Demo Credentials Callout -->
        <div class="alert alert-light border mt-4 p-2 small text-muted text-center">
          <i class="bi bi-info-circle me-1 text-primary"></i>
          <strong>Demo User:</strong> <code>priya.sharma@example.com</code> / <code>PriyaPass@123</code>
        </div>
      </form>
    </div>
  </main>

  <footer class="kavach-footer py-3 mt-auto">
    <div class="container text-center small text-muted">
      &copy; 2026 KAVACH-X Emergency Response Platform &bull; <a href="admin.html" class="admin-stealth-link">Sign in as Admin</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
